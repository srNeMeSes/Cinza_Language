# Integração contínua (REVISAO_V2.md, Q4): a suíte nos dois backends — a CVM (`make test`) e o
# cinzac em -O0 (`make test-llvm`) e -O2 — no Linux (GCC 15 e Clang 20) e no Windows (MSYS2, GCC
# e o LLVM 20.1.8), a cada push e pull request. O compilador precisa do #embed (GCC 15 ou Clang 19
# em diante) e o cinzac do LLVM 20.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  linux-gcc:
    name: Linux (GCC 15)
    runs-on: ubuntu-24.04
    container: gcc:15
    steps:
      - uses: actions/checkout@v5
      - name: LLVM 20 e Python
        run: |
          apt-get update
          apt-get install -y --no-install-recommends wget gnupg ca-certificates python3
          . /etc/os-release
          wget -qO /etc/apt/trusted.gpg.d/apt.llvm.org.asc https://apt.llvm.org/llvm-snapshot.gpg.key
          echo "deb http://apt.llvm.org/$VERSION_CODENAME/ llvm-toolchain-$VERSION_CODENAME-20 main" \
            > /etc/apt/sources.list.d/llvm.list
          apt-get update
          apt-get install -y --no-install-recommends llvm-20-dev
          g++ --version
          llvm-config-20 --version
      - name: CVM
        run: |
          make -j"$(nproc)"
          make test
      - name: cinzac -O0
        if: always()
        run: |
          make -j"$(nproc)" cinzac
          make test-llvm
      - name: cinzac -O2
        if: always()
        run: python3 tests/run_tests.py --cinzac --O2

  linux-clang:
    name: Linux (Clang 20)
    runs-on: ubuntu-24.04
    env:
      CINZA_GXX: clang++-20   # o cinzac liga os programas com o mesmo compilador da libcinzart
    steps:
      - uses: actions/checkout@v5
      - name: Clang e LLVM 20
        run: |
          wget -q https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 20
          sudo apt-get install -y --no-install-recommends llvm-20-dev
          clang++-20 --version
      - name: CVM
        run: |
          make -j"$(nproc)" CXX=clang++-20
          make test CXX=clang++-20
      - name: cinzac -O0
        if: always()
        run: |
          make -j"$(nproc)" cinzac CXX=clang++-20
          make test-llvm CXX=clang++-20
      - name: cinzac -O2
        if: always()
        run: python3 tests/run_tests.py --cinzac --O2

  # Q5: a distribuição do Linux — o cinza e o cinzac estáticos com a musl (Alpine), o lld dentro do
  # cinzac e os programas gerados também estáticos. O clang 20 por causa do #embed (o GCC do Alpine
  # 3.22 é o 14).
  linux-estatico:
    name: Linux estático (Alpine, musl)
    runs-on: ubuntu-24.04
    container: alpine:3.22
    steps:
      - uses: actions/checkout@v5
      - name: clang, lld e LLVM 20 estáticos
        run: |
          apk add --no-cache build-base python3 linux-headers clang20 llvm20-dev llvm20-static lld20-dev \
            zlib-static zstd-static libxml2-static libffi-dev file
          ls /usr/lib/llvm20/bin | head -50
          ls /usr/lib/llvm20/lib | grep -E 'lld|LLVMCore' || true
          /usr/lib/llvm20/bin/llvm-config --link-static --system-libs || true
          echo 'int main(){}' > /tmp/v.cpp && /usr/lib/llvm20/bin/clang++ -static -v /tmp/v.cpp -o /tmp/v 2>&1 | tail -3
      - name: CVM
        run: |
          make -j"$(nproc)" ESTATICO=1 CXX=/usr/lib/llvm20/bin/clang++
          file cinza
          make test ESTATICO=1 CXX=/usr/lib/llvm20/bin/clang++
      - name: cinzac -O0
        if: always()
        run: |
          make -j"$(nproc)" cinzac ESTATICO=1 CXX=/usr/lib/llvm20/bin/clang++ LLVM_CONFIG=/usr/lib/llvm20/bin/llvm-config
          file llvm/bin/cinzac
          ls -la llvm/bin llvm/bin/runtime
          make test-llvm ESTATICO=1 CXX=/usr/lib/llvm20/bin/clang++ LLVM_CONFIG=/usr/lib/llvm20/bin/llvm-config
      - name: cinzac -O2
        if: always()
        run: python3 tests/run_tests.py --cinzac --O2

  windows:
    name: Windows (MSYS2, GCC e LLVM 20)
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v5
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            make
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-python
      # O clang, o lld e o LLVM 20.1.8 do CLANG64 (Q5: o cinzac e o runtime são compilados pelo
      # clang, com o LLVM e o lld estáticos), com as dependências nas versões do desenvolvimento —
      # com as atuais do MSYS2 as bibliotecas do LLVM não acham funções delas
      - name: clang, lld e LLVM 20.1.8 (os do desenvolvimento, do arquivo do MSYS2)
        run: |
          base=https://repo.msys2.org/mingw/clang64
          pacman -U --noconfirm \
            $base/mingw-w64-clang-x86_64-libwinpthread-13.0.0.r124.g2717de84e-1-any.pkg.tar.zst \
            $base/mingw-w64-clang-x86_64-winpthreads-13.0.0.r124.g2717de84e-1-any.pkg.tar.zst \
            $base/mingw-w64-clang-x86_64-headers-git-13.0.0.r124.g2717de84e-1-any.pkg.tar.zst \
            $base/mingw-w64-clang-x86_64-crt-git-13.0.0.r124.g2717de84e-1-any.pkg.tar.zst \
            $base/mingw-w64-clang-x86_64-libunwind-20.1.8-1-any.pkg.tar.zst \
            $base/mingw-w64-clang-x86_64-libc++-20.1.8-1-any.pkg.tar.zst \
            $base/mingw-w64-clang-x86_64-libffi-3.5.1-1-any.pkg.tar.zst \
            $base/mingw-w64-clang-x86_64-libiconv-1.18-1-any.pkg.tar.zst \
            $base/mingw-w64-clang-x86_64-xz-5.8.1-2-any.pkg.tar.zst \
            $base/mingw-w64-clang-x86_64-zlib-1.3.1-1-any.pkg.tar.zst \
            $base/mingw-w64-clang-x86_64-zstd-1.5.7-1-any.pkg.tar.zst \
            $base/mingw-w64-clang-x86_64-libxml2-2.14.5-2-any.pkg.tar.zst \
            $base/mingw-w64-clang-x86_64-llvm-libs-20.1.8-2-any.pkg.tar.zst \
            $base/mingw-w64-clang-x86_64-llvm-tools-20.1.8-2-any.pkg.tar.zst \
            $base/mingw-w64-clang-x86_64-llvm-20.1.8-2-any.pkg.tar.zst \
            $base/mingw-w64-clang-x86_64-compiler-rt-20.1.8-2-any.pkg.tar.zst \
            $base/mingw-w64-clang-x86_64-lld-20.1.8-2-any.pkg.tar.zst \
            $base/mingw-w64-clang-x86_64-clang-libs-20.1.8-2-any.pkg.tar.zst \
            $base/mingw-w64-clang-x86_64-clang-20.1.8-2-any.pkg.tar.zst
          test -f /clang64/include/llvm-c/Core.h   # o pacman pula um pacote sem dependência, sem falhar
          test -f /clang64/lib/liblldMinGW.a
          test -f /clang64/bin/clang++.exe
          ls /clang64/bin | grep -E '^lib(LLVM|c\+\+|ffi|iconv|lzma|xml2|zstd)|zlib1'
          g++ --version
      - name: CVM
        run: |
          make -j"$(nproc)"
          make test
      - name: cinzac -O0
        if: always()
        run: |
          make -j"$(nproc)" cinzac LLVM_PREFIX="$(cygpath -m /clang64)"
          make test-llvm LLVM_PREFIX="$(cygpath -m /clang64)"
      - name: cinzac -O2
        if: always()
        run: python3 tests/run_tests.py --cinzac --O2
