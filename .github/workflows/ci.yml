# Integração contínua (REVISAO_V2.md, Q4): a suíte nos dois backends — a CVM (`make test`) e o
# cinzac em -O0 (`make test-llvm`) e -O2 — no Linux (GCC 15 e Clang 20) e no Windows (MSYS2, GCC
# e o LLVM 20.1.8), a cada push e pull request. O compilador precisa do #embed (GCC 15 ou Clang 19
# em diante) e o cinzac do LLVM 20.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  linux-gcc:
    name: Linux (GCC 15)
    runs-on: ubuntu-24.04
    container: gcc:15
    steps:
      - uses: actions/checkout@v5
      - name: LLVM 20 e Python
        run: |
          apt-get update
          apt-get install -y --no-install-recommends wget gnupg ca-certificates python3
          . /etc/os-release
          wget -qO /etc/apt/trusted.gpg.d/apt.llvm.org.asc https://apt.llvm.org/llvm-snapshot.gpg.key
          echo "deb http://apt.llvm.org/$VERSION_CODENAME/ llvm-toolchain-$VERSION_CODENAME-20 main" \
            > /etc/apt/sources.list.d/llvm.list
          apt-get update
          apt-get install -y --no-install-recommends llvm-20-dev
          g++ --version
          llvm-config-20 --version
      - name: CVM
        run: |
          make -j"$(nproc)"
          make test
      - name: cinzac -O0
        if: always()
        run: |
          make -j"$(nproc)" cinzac
          make test-llvm
      - name: cinzac -O2
        if: always()
        run: python3 tests/run_tests.py --cinzac --O2

  linux-clang:
    name: Linux (Clang 20)
    runs-on: ubuntu-24.04
    env:
      CINZA_GXX: clang++-20   # o cinzac liga os programas com o mesmo compilador da libcinzart
    steps:
      - uses: actions/checkout@v5
      - name: Clang e LLVM 20
        run: |
          wget -q https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 20
          sudo apt-get install -y --no-install-recommends llvm-20-dev
          clang++-20 --version
      - name: CVM
        run: |
          make -j"$(nproc)" CXX=clang++-20
          make test CXX=clang++-20
      - name: cinzac -O0
        if: always()
        run: |
          make -j"$(nproc)" cinzac CXX=clang++-20
          make test-llvm CXX=clang++-20
      - name: cinzac -O2
        if: always()
        run: python3 tests/run_tests.py --cinzac --O2

  # Q5: a distribuição do Linux — o cinza e o cinzac estáticos com a musl (Alpine), o lld dentro do
  # cinzac e os programas gerados também estáticos. O clang 20 por causa do #embed (o GCC do Alpine
  # 3.22 é o 14).
  linux-estatico:
    name: Linux estático (Alpine, musl)
    runs-on: ubuntu-24.04
    container: alpine:3.22
    steps:
      - uses: actions/checkout@v5
      - name: clang, lld e LLVM 20 estáticos
        run: |
          apk add --no-cache build-base python3 linux-headers clang20 llvm20-dev llvm20-static lld20-dev \
            zlib-static zstd-static libxml2-static libffi-dev file \
            libc++-dev libc++-static llvm-libunwind-dev llvm-libunwind-static compiler-rt
          ls /usr/lib/llvm20/bin | head -50
          ls /usr/lib/llvm20/lib | grep -E 'lld|LLVMCore' || true
          /usr/lib/llvm20/bin/llvm-config --link-static --system-libs || true
          echo 'int main(){}' > /tmp/v.cpp && /usr/lib/llvm20/bin/clang++ -static -v /tmp/v.cpp -o /tmp/v 2>&1 | tail -3
      # O Alpine só traz o lld em .so: as bibliotecas estáticas dele (ELF e Common) são compiladas da
      # fonte oficial do 20.1.8, contra o LLVM 20.1.8 estático do Alpine, e guardadas em cache
      - uses: actions/cache@v4
        id: cache-lld
        with:
          path: /opt/lld-estatico
          key: lld-20.1.8-alpine-3.22-v1
      - name: lld 20.1.8 estático
        if: steps.cache-lld.outputs.cache-hit != 'true'
        run: |
          apk add --no-cache cmake samurai xz
          # o LLVMExports.cmake do Alpine cita bibliotecas que o pacote não instala (as de teste do
          # LLVM); o cmake só confere se existem, e o lld não as usa: ficam vazias
          exports=/usr/lib/llvm20/lib/cmake/llvm/LLVMExports*.cmake
          for f in $(grep -oh '_IMPORT_PREFIX}/lib/lib[A-Za-z0-9_]*\.a' $exports | sed 's|_IMPORT_PREFIX}|/usr/lib/llvm20|' | sort -u); do
            [ -f "$f" ] || { ar rcs "$f"; echo "vazia: $f"; }
          done
          cd /tmp
          base=https://github.com/llvm/llvm-project/releases/download/llvmorg-20.1.8
          wget -q $base/lld-20.1.8.src.tar.xz $base/cmake-20.1.8.src.tar.xz
          tar xf lld-20.1.8.src.tar.xz && mv lld-20.1.8.src lld
          tar xf cmake-20.1.8.src.tar.xz && mv cmake-20.1.8.src cmake
          cmake -S lld -B lld-build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DLLVM_DIR=/usr/lib/llvm20/lib/cmake/llvm -DBUILD_SHARED_LIBS=OFF -DLLVM_INCLUDE_TESTS=OFF \
            -DCMAKE_C_COMPILER=/usr/lib/llvm20/bin/clang -DCMAKE_CXX_COMPILER=/usr/lib/llvm20/bin/clang++
          ninja -C lld-build lldELF lldCommon
          mkdir -p /opt/lld-estatico
          find lld-build -name 'liblld*.a' -exec cp {} /opt/lld-estatico/ \;
          ls -la /opt/lld-estatico
      - name: CVM
        run: |
          make -j"$(nproc)" ESTATICO=1 CXX=/usr/lib/llvm20/bin/clang++
          file cinza
          make test ESTATICO=1 CXX=/usr/lib/llvm20/bin/clang++
      - name: cinzac -O0
        if: always()
        run: |
          make -j"$(nproc)" cinzac ESTATICO=1 CXX=/usr/lib/llvm20/bin/clang++ LLVM_CONFIG=/usr/lib/llvm20/bin/llvm-config \
            LLD_LIBDIR=/opt/lld-estatico
          file llvm/bin/cinzac
          ls -la llvm/bin llvm/bin/runtime
          printf 'fn main() {\n  print("ação", [1, 2], {{"a", 1}});\n}\n' > /tmp/ola.cinza
          ./llvm/bin/cinzac /tmp/ola.cinza -o /tmp/ola && file /tmp/ola && /tmp/ola
          make test-llvm ESTATICO=1 CXX=/usr/lib/llvm20/bin/clang++ LLVM_CONFIG=/usr/lib/llvm20/bin/llvm-config \
            LLD_LIBDIR=/opt/lld-estatico
      - name: cinzac -O2
        if: always()
        run: python3 tests/run_tests.py --cinzac --O2
      - name: Pacote
        run: |
          apk add --no-cache wget
          baixa() { mkdir -p "/tmp/licencas/$1" && wget -qO "/tmp/licencas/$1/$3" "$2"; }
          baixa llvm https://raw.githubusercontent.com/llvm/llvm-project/llvmorg-20.1.8/llvm/LICENSE.TXT LICENSE.TXT
          baixa musl "https://git.musl-libc.org/cgit/musl/plain/COPYRIGHT?h=v1.2.5" COPYRIGHT
          baixa zlib https://raw.githubusercontent.com/madler/zlib/v1.3.1/LICENSE LICENSE
          baixa zstd https://raw.githubusercontent.com/facebook/zstd/v1.5.7/LICENSE LICENSE
          LICENCAS="/tmp/licencas/llvm /tmp/licencas/musl /tmp/licencas/zlib /tmp/licencas/zstd" \
            sh distribuicao/empacota.sh linux-x64
      - uses: actions/upload-artifact@v4
        with:
          name: cinza-linux-x64
          path: dist/*.tar.gz

  windows:
    name: Windows (MSYS2, GCC e LLVM 20)
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v5
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            make
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-python
      # O clang, o lld e o LLVM 20.1.8 do CLANG64 (Q5: o cinzac e o runtime são compilados pelo
      # clang, com o LLVM e o lld estáticos), com as dependências nas versões do desenvolvimento —
      # com as atuais do MSYS2 as bibliotecas do LLVM não acham funções delas
      - name: clang, lld e LLVM 20.1.8 (os do desenvolvimento, do arquivo do MSYS2)
        run: |
          base=https://repo.msys2.org/mingw/clang64
          pacman -U --noconfirm \
            $base/mingw-w64-clang-x86_64-libwinpthread-13.0.0.r124.g2717de84e-1-any.pkg.tar.zst \
            $base/mingw-w64-clang-x86_64-winpthreads-13.0.0.r124.g2717de84e-1-any.pkg.tar.zst \
            $base/mingw-w64-clang-x86_64-headers-git-13.0.0.r124.g2717de84e-1-any.pkg.tar.zst \
            $base/mingw-w64-clang-x86_64-crt-git-13.0.0.r124.g2717de84e-1-any.pkg.tar.zst \
            $base/mingw-w64-clang-x86_64-libunwind-20.1.8-1-any.pkg.tar.zst \
            $base/mingw-w64-clang-x86_64-libc++-20.1.8-1-any.pkg.tar.zst \
            $base/mingw-w64-clang-x86_64-libffi-3.5.1-1-any.pkg.tar.zst \
            $base/mingw-w64-clang-x86_64-libiconv-1.18-1-any.pkg.tar.zst \
            $base/mingw-w64-clang-x86_64-xz-5.8.1-2-any.pkg.tar.zst \
            $base/mingw-w64-clang-x86_64-zlib-1.3.1-1-any.pkg.tar.zst \
            $base/mingw-w64-clang-x86_64-zstd-1.5.7-1-any.pkg.tar.zst \
            $base/mingw-w64-clang-x86_64-libxml2-2.14.5-2-any.pkg.tar.zst \
            $base/mingw-w64-clang-x86_64-llvm-libs-20.1.8-2-any.pkg.tar.zst \
            $base/mingw-w64-clang-x86_64-llvm-tools-20.1.8-2-any.pkg.tar.zst \
            $base/mingw-w64-clang-x86_64-llvm-20.1.8-2-any.pkg.tar.zst \
            $base/mingw-w64-clang-x86_64-compiler-rt-20.1.8-2-any.pkg.tar.zst \
            $base/mingw-w64-clang-x86_64-lld-20.1.8-2-any.pkg.tar.zst \
            $base/mingw-w64-clang-x86_64-clang-libs-20.1.8-2-any.pkg.tar.zst \
            $base/mingw-w64-clang-x86_64-clang-20.1.8-2-any.pkg.tar.zst
          test -f /clang64/include/llvm-c/Core.h   # o pacman pula um pacote sem dependência, sem falhar
          test -f /clang64/lib/liblldMinGW.a
          test -f /clang64/bin/clang++.exe
          ls /clang64/bin | grep -E '^lib(LLVM|c\+\+|ffi|iconv|lzma|xml2|zstd)|zlib1'
          g++ --version
      - name: CVM
        run: |
          make -j"$(nproc)"
          make test
      - name: cinzac -O0
        if: always()
        run: |
          make -j"$(nproc)" cinzac LLVM_PREFIX="$(cygpath -m /clang64)"
          make test-llvm LLVM_PREFIX="$(cygpath -m /clang64)"
      - name: cinzac -O2
        if: always()
        run: python3 tests/run_tests.py --cinzac --O2
      - name: Pacote
        run: |
          pacman -S --noconfirm --needed zip
          L=/clang64/share/licenses
          LICENCAS="$L/llvm $L/lld $L/libc++ $L/libunwind $L/compiler-rt $L/crt $L/headers $L/winpthreads $L/zlib $L/zstd" \
            sh distribuicao/empacota.sh windows-x64
      - uses: actions/upload-artifact@v4
        with:
          name: cinza-windows-x64
          path: dist/*.zip

  vsix:
    name: Extensão do VS Code (.vsix)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: vsce package
        run: |
          mkdir -p dist
          cp LICENSE editor/vscode/LICENSE
          cd editor/vscode && npx --yes @vscode/vsce@3.2.1 package --no-dependencies -o ../../dist/
      - uses: actions/upload-artifact@v4
        with:
          name: cinza-vscode
          path: dist/*.vsix

  # Q5: numa tag v<versão> (a de versao.h), os pacotes e a extensão viram um release do GitHub
  publicar:
    name: Release no GitHub
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux-gcc, linux-clang, linux-estatico, windows, vsix]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          path: artefatos
          merge-multiple: true
      - name: gh release create
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=${GITHUB_REF_NAME#v}
          grep -q "CINZA_VERSAO \"$v\"" versao.h || { echo "a tag $GITHUB_REF_NAME não é a versão de versao.h"; exit 1; }
          ls -la artefatos
          gh release create "$GITHUB_REF_NAME" artefatos/* --title "Cinza $v" --notes-file distribuicao/NOTAS.md --prerelease
